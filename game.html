<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spaceman Crash - Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="game-body">

<div class="app" id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="saldo">
      <span>Saldo Lu</span>
      <b id="saldoDisplay">Rp0</b>
    </div>
    <div class="user">
      <div class="avatar" id="userAvatar">?</div>
      <div class="name" id="userName">-</div>
    </div>
  </div>

  <!-- AREA GAME -->
  <div class="game-area" id="gameArea">
    <div class="stars" id="stars"></div>
    <div class="crash-overlay" id="crashOverlay"></div>
    <div class="multiplier" id="multiplier">1.00x</div>

    <div class="astronaut-wrap" id="astronautWrap">
      <img src="astronaut.svg" alt="Astronaut" class="astronaut" id="astronaut">
      <div class="trail-line" id="trailLine"></div>
    </div>

    <div class="status-text" id="statusText">TUNGGU PERMAINAN BERIKUTNYA</div>
    <div class="players-count" id="playersCount">👥 1248 pemain online</div>
  </div>

  <!-- CHAT -->
  <div class="chat-box" id="chatBox"></div>
  <div class="chat-input-area">
    <input type="text" id="chatInput" placeholder="Ketik chat..." maxlength="80">
    <button onclick="sendChat()">KIRIM</button>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="quick-btns">
      <button onclick="setBet(2000)">Rp2K</button>
      <button onclick="setBet(10000)">Rp10K</button>
      <button onclick="setBet(50000)">Rp50K</button>
      <button onclick="setBet(200000)">Rp200K</button>
    </div>
    <div class="bet-row">
      <span class="label">Taruhan</span>
      <input type="number" id="betInput" value="2000" min="1000" step="1000">
    </div>
    <button class="action-btn bet" id="actionBtn" onclick="handleAction()">TARUHAN</button>
  </div>

  <button class="bonus-btn" id="bonusBtn" onclick="claimBonus()">🎁 KLAIM BONUS</button>
  <button class="logout-btn" onclick="logout()">Keluar</button>

  <div class="toast" id="toast"></div>
</div>

<script src="game.js"></script>
</body>
</html>
